<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#061326" />
  <title>Coming Soon</title>

  <style>
    :root {
      --ice: #dff8ff;
      --blue: #6fe5ff;
      --deep: #061326;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      color: white;
      font-family: "Arial", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(29, 110, 161, .32), transparent 42%),
        linear-gradient(180deg, #030914 0%, #071a32 48%, #0b2943 100%);
    }

    .aurora {
      position: absolute;
      inset: -30% -20%;
      z-index: -3;
      pointer-events: none;
      filter: blur(48px);
      opacity: .5;
      background:
        radial-gradient(ellipse at 20% 35%, rgba(43, 222, 211, .24), transparent 32%),
        radial-gradient(ellipse at 75% 25%, rgba(63, 121, 255, .26), transparent 35%),
        radial-gradient(ellipse at 52% 70%, rgba(83, 199, 255, .17), transparent 34%);
      animation: aurora 13s ease-in-out infinite alternate;
    }

    @keyframes aurora {
      from { transform: translate3d(-2%, -1%, 0) rotate(-3deg) scale(1); }
      to   { transform: translate3d(2%, 2%, 0) rotate(4deg) scale(1.08); }
    }

    .glow {
      position: absolute;
      z-index: -2;
      width: min(75vw, 850px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(69, 194, 255, .14), transparent 68%);
      filter: blur(14px);
      pointer-events: none;
    }

    .forest {
      position: absolute;
      z-index: -1;
      inset: auto 0 0;
      height: clamp(140px, 26vh, 270px);
      opacity: .72;
      pointer-events: none;
    }

    .forest svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #snow {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    main {
      width: min(100% - 32px, 1100px);
      text-align: center;
      position: relative;
      z-index: 3;
      padding: 32px 0 90px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 26px;
      color: #c5edff;
      font-size: clamp(.65rem, 1.4vw, .85rem);
      letter-spacing: .42em;
      text-transform: uppercase;
      opacity: .88;
      animation: fadeIn 1.3s ease both;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 30px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #8be9ff);
    }

    .eyebrow::after {
      transform: rotate(180deg);
    }

    /* LED-Schrift */
    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 10.5vw, 9rem);
      line-height: .98;
      font-weight: 900;
      letter-spacing: clamp(.02em, .65vw, .095em);
      text-transform: uppercase;
      color: var(--ice);
      position: relative;
      animation: titleReveal 1.4s cubic-bezier(.2,.75,.2,1) both;
      text-shadow:
        0 1px 0 #b9f5ff,
        0 2px 0 #8eeaff,
        0 3px 0 #55cce9,
        0 4px 0 #2587b4,
        0 5px 0 #155c87,
        0 8px 18px rgba(0, 0, 0, .65),
        0 0 12px rgba(124, 232, 255, .95),
        0 0 32px rgba(56, 194, 255, .78),
        0 0 72px rgba(39, 147, 255, .5);
    }

    h1 span {
      display: inline-block;
      animation: ledPulse 4s ease-in-out 1.5s infinite;
    }

    .divider {
      width: 94px;
      height: 2px;
      margin: 26px auto 0;
      background: linear-gradient(90deg, transparent, #8feaff, transparent);
      box-shadow: 0 0 18px #5cdfff;
      animation: fadeIn 1.6s .5s ease both;
    }

    /* Funkelnde Partikel */
    .sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 12px 3px rgba(139, 231, 255, .75);
      animation: twinkle 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    .sparkle.one {
      top: 17%;
      left: 18%;
    }

    .sparkle.two {
      top: 24%;
      right: 19%;
      animation-delay: .8s;
    }

    .sparkle.three {
      bottom: 28%;
      left: 24%;
      animation-delay: 1.4s;
    }

    .sparkle.four {
      bottom: 25%;
      right: 25%;
      animation-delay: .4s;
    }

    /* Unterer Bereich inklusive Discord-Button */
    .bottom-note {
      position: absolute;
      z-index: 4;
      bottom: max(22px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      padding: 0 16px;
      color: rgba(200, 231, 247, .65);
      font-size: .7rem;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    .discord-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 23px;
      border: 1px solid rgba(143, 234, 255, .7);
      border-radius: 999px;
      color: #e8fbff;
      background: rgba(25, 104, 147, .28);
      box-shadow:
        0 0 18px rgba(73, 205, 255, .2),
        inset 0 0 16px rgba(73, 205, 255, .07);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-decoration: none;
      transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .discord-button:hover,
    .discord-button:focus-visible {
      transform: translateY(-3px) scale(1.03);
      background: rgba(38, 148, 195, .42);
      border-color: #dffaff;
      box-shadow:
        0 0 28px rgba(73, 205, 255, .42),
        0 0 55px rgba(73, 205, 255, .15),
        inset 0 0 18px rgba(73, 205, 255, .12);
      outline: none;
    }

    .discord-button svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
      flex-shrink: 0;
    }

    @keyframes titleReveal {
      from {
        opacity: 0;
        transform: translateY(24px) scale(.96);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes ledPulse {
      0%, 100% { filter: brightness(1); }
      48% { filter: brightness(1.12); }
      50% { filter: brightness(.9); }
      52% { filter: brightness(1.16); }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: .25;
        transform: scale(.7);
      }
      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    @media (max-width: 520px) {
      main {
        padding-bottom: 45px;
      }

      .eyebrow {
        letter-spacing: .25em;
        margin-bottom: 22px;
      }

      .forest {
        height: 19vh;
      }

      .bottom-note {
        letter-spacing: .15em;
        font-size: .62rem;
      }

      .discord-button {
        padding: 12px 18px;
        font-size: .68rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="glow" aria-hidden="true"></div>

  <!-- Discord-Link unten auf der Website -->
  <div class="bottom-note">
    <a
      class="discord-button"

    >

        <path d="M19.7 5.3a18.4 18.4 0 0 0-4.5-1.4l-.6 1.2a16.8 16.8 0 0 0-5.2 0l-.6-1.2a18.4 18.4 0 0 0-4.5 1.4C1.5 9.5.7 13.6 1.1 17.7a18.6 18.6 0 0 0 5.6 3.1l1.2-2a11.8 11.8 0 0 1-1.9-.9l.5-.4a13.3 13.3 0 0 0 11 0l.5.4a11.8 11.8 0 0 1-1.9.9l1.2 2a18.6 18.6 0 0 0 5.6-3.1c.5-4.8-.8-8.9-3.2-12.4ZM8.8 15.1c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Zm6.4 0c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Z"/>

    <span>Soon available...</span>

  <script>
    (() => {
      const canvas = document.getElementById("snow");
      const ctx = canvas.getContext("2d");
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      let width = 0;
      let height = 0;
      let flakes = [];

      const flakeCount = Math.min(
        150,
        Math.floor((window.innerWidth * window.innerHeight) / 8500)
      );

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        flakes = Array.from(
          { length: flakeCount },
          () => makeFlake(true)
        );
      }

      function makeFlake(randomY = false) {
        return {
          x: Math.random() * width,
          y: randomY ? Math.random() * height : -10,
          radius: Math.random() * 2.6 + .6,
          speed: Math.random() * 1.1 + .35,
          drift: (Math.random() - .5) * .65,
          opacity: Math.random() * .65 + .2,
          phase: Math.random() * Math.PI * 2
        };
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        for (const f of flakes) {
          ctx.beginPath();
          ctx.fillStyle = `rgba(231, 248, 255, ${f.opacity})`;
          ctx.shadowBlur = f.radius > 2 ? 8 : 3;
          ctx.shadowColor = "rgba(139, 226, 255, .75)";
          ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
          ctx.fill();

          if (!reducedMotion) {
            f.y += f.speed;
            f.x += f.drift + Math.sin(f.phase + f.y * .012) * .35;

            if (f.y > height + 8) {
              Object.assign(f, makeFlake(false));
            }

            if (f.x < -10) f.x = width + 10;
            if (f.x > width + 10) f.x = -10;
          }
        }

        ctx.shadowBlur = 0;

        if (!reducedMotion) {
          requestAnimationFrame(draw);
        }
      }

      window.addEventListener("resize", resize, { passive: true });

      resize();
      draw();
    })();
  </script>
</body>
</html>
