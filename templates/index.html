<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EasyRanks — Brawl Stars Boosting</title>
<meta name="description" content="EasyRanks — Brawl Stars Boosting. Fast, secure, trusted." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>

<header class="site-header">
  <a class="logo-wrap" href="/">
    <span class="logo-mark">⚡</span>
    <span class="logo-text">EASYRANKS</span>
  </a>
  <div class="auth-area" id="authArea"></div>
</header>

<main class="page">

  <section class="hero-card">
    <div class="hero-top">
      <h1 class="hero-title">EasyRanks</h1>
      <p class="hero-sub">Brawl Stars Boosting · Trusted &amp; Fast</p>
    </div>
    <div class="hero-divider"></div>
    <div class="hero-bottom">
      <div class="stat">
        <div class="stat-value" id="statReviews">0</div>
        <div class="stat-label">Reviews</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statAvg">—</div>
        <div class="stat-label">Avg Rating</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statStars">0</div>
        <div class="stat-label">Stars Given</div>
      </div>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="shop" type="button">Shop</button>
    <button class="tab" data-tab="reviews" type="button">Reviews</button>
    <span class="tab-slider" id="tabSlider"></span>
  </nav>

  <section class="panel active" id="panel-shop"></section>

  <section class="panel" id="panel-reviews">
    <div class="reviews-toolbar">
      <div class="reviews-summary" id="reviewsSummary">Loading reviews…</div>
      <button class="btn ghost small" id="refreshReviews" type="button">↻ Refresh</button>
    </div>
    <div class="reviews-grid" id="reviewsGrid"></div>
    <div class="reviews-empty" id="reviewsEmpty" hidden>No reviews yet. Be the first!</div>
  </section>

</main>

<footer class="site-footer">
  <p>© <span id="year"></span> EasyRanks — All rights reserved.</p>
  <a class="footer-discord" href="https://discord.gg/easyranks" target="_blank" rel="noopener">discord.gg/easyranks</a>
</footer>

<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" type="button" aria-label="Close">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/static/app.js"></script>
</body>
</html>
